<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MiCarta — tu carta digital con QR, gratis</title>
<meta name="description" content="Crea la carta o catálogo de tu negocio en 3 minutos. Te queda un link y un código QR para imprimir, y tus clientes te piden por WhatsApp. Gratis, sin registro.">
<meta name="theme-color" content="#E23E2E">
<!-- La carta va en el fragmento (#), que nunca llega al servidor: la vista previa
     al compartir es siempre la misma. La escribimos para el caso más frecuente,
     que es un negocio mandando su carta por WhatsApp. -->
<meta property="og:title" content="Mira la carta y pide por WhatsApp 👇">
<meta property="og:description" content="Carta digital con precios al día. Armas tu pedido y le llega al negocio ya sumado. Hecha con MiCarta, gratis.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://micarta.weissailab.com/">
<meta property="og:image" content="https://micarta.weissailab.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
<!-- Pages sirve con max-age=600: la versión evita que alguien que ya entró
     siga corriendo el código viejo. Súbela al cambiar app.js o app.css. -->
<link rel="stylesheet" href="app.css?v=8">
</head>
<body>
<div id="app"></div>
<script src="vendor/lz-string.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="app.js?v=8"></script>
</body>
</html>
